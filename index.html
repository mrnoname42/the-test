<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Discord Webhook Router</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; background-color: #2f3136; color: #dcddde; }
        .card { background: #36393f; padding: 25px; border-radius: 8px; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #202225; }
        span { font-family: monospace; font-weight: bold; color: #7289da; word-break: break-all; }
        button { background-color: #5865F2; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        button:hover { background-color: #4752c4; }
        button:disabled { background-color: #4f545c; cursor: not-allowed; }
        .status { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: rgba(59, 165, 93, 0.2); color: #3ba55d; border: 1px solid #3ba55d; }
        .error { background-color: rgba(237, 66, 69, 0.2); color: #ed4245; border: 1px solid #ed4245; }
    </style>
</head>
<body>

    <h1>Discord Webhook Dispatcher</h1>
    <div class="card">
        <p><strong>Decoded Webhook URL:</strong> <span id="webhook-display">None detected</span></p>
        <p><strong>Decoded Message:</strong> <span id="message-display">None detected</span></p>
        
        <button id="send-btn" disabled onclick="sendToDiscord()">Send Message to Discord</button>
        <div id="status-box" class="status"></div>
    </div>

    <script>
        let globalWebhookUrl = '';
        let globalMessage = '';

        // Safe Base64 Decoding that supports URL symbols and Unicode
        function decodeUrlSafeBase64(base64url) {
            if (!base64url) return '';
            let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/'); // Revert URL safe characters
            while (base64.length % 4) base64 += '='; // Re-add missing padding
            try {
                // Convert back from binary string safely
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch (e) {
                console.error("Base64 decoding failed:", e);
                return 'Error decoding data';
            }
        }

        function processUrl() {
            const hash = window.location.hash;
            if (hash) {
                // Remove the '#' and split your router fragments
                const segments = hash.replace(/^#\/?/, '').split('/').filter(Boolean);

                if (segments.length >= 2) {
                    // Extract and decode both data parameters
                    globalWebhookUrl = decodeUrlSafeBase64(segments[0]);
                    globalMessage = decodeUrlSafeBase64(segments[1]);

                    // Update UI elements
                    document.getElementById('webhook-display').innerText = globalWebhookUrl;
                    document.getElementById('message-display').innerText = globalMessage;

                    // Validate if it looks like a real discord webhook
                    if (globalWebhookUrl.startsWith('https://discord.com/api/webhooks/') || globalWebhookUrl.startsWith('https://discordapp.com')) {
                        document.getElementById('send-btn').disabled = false;
                    } else {
                        document.getElementById('webhook-display').innerText = "Invalid Discord Webhook format.";
                    }
                }
            }
        }

        async function sendToDiscord() {
            const btn = document.getElementById('send-btn');
            const statusBox = document.getElementById('status-box');
            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                // Post payload directly to Discord API
                const response = await fetch(globalWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: globalMessage })
                });

                if (response.ok || response.status === 204) { // Discord returns 204 No Content on successful hooks
                    statusBox.className = "status success";
                    statusBox.innerText = "🚀 Message sent successfully!";
                } else {
                    throw new Error(`Server status: ${response.status}`);
                }
            } catch (error) {
                statusBox.className = "status error";
                statusBox.innerText = "❌ Failed to send message. Check Webhook URL.";
                console.error(error);
            } finally {
                statusBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Send Message to Discord";
            }
        }

        window.addEventListener('hashchange', processUrl);
        window.addEventListener('DOMContentLoaded', processUrl);
    </script>
</body>
</html>
